<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REDLINE — CAMPAIGN</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111116;--paper:#f4f2ee;--red:#ff2418}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0c;color:var(--paper);font:14px/1.6 'IBM Plex Mono',monospace;padding:6vh 6vw;min-height:100vh}
h1{font-family:'Archivo Black';font-size:clamp(40px,7vw,86px);line-height:.9}
h1 em{font-style:normal;color:var(--red)}
#tag{letter-spacing:.4em;color:var(--red);font-weight:700;margin:10px 0 26px;font-size:12px}
#bar{height:8px;border:2px solid var(--paper);max-width:520px;margin-bottom:8px}
#bar i{display:block;height:100%;background:var(--red);width:0}
#pct{font-size:11px;letter-spacing:.3em;opacity:.6;margin-bottom:34px}
h2{font-size:12px;letter-spacing:.4em;color:var(--red);margin:34px 0 10px;font-weight:700}
.m{display:flex;gap:18px;align-items:baseline;padding:13px 4px;border-bottom:1px solid rgba(244,242,238,.14);max-width:860px}
.m .n{font-family:'Archivo Black';font-size:22px;opacity:.35;width:44px;flex:none}
.m .t{font-family:'Archivo Black';font-size:16px}
.m .d{font-size:11px;opacity:.55;letter-spacing:.06em}
.m .s{margin-left:auto;flex:none;font-size:9px;letter-spacing:.25em;font-weight:700;border:1.5px solid;padding:3px 8px}
.s.brief{color:#ffd23d;border-color:#ffd23d}
.s.ready{color:var(--red);border-color:var(--red)}
.s.done{color:#39d977;border-color:#39d977}
.s.lock{opacity:.35;border-color:var(--paper)}
a.m{text-decoration:none;color:inherit}
.m.ready:hover{background:rgba(255,36,24,.08)}
#back{display:inline-block;margin-top:40px;color:var(--paper);font-size:11px;letter-spacing:.3em;text-decoration:none;border:2px solid var(--paper);padding:10px 18px}
#back:hover{background:var(--paper);color:var(--ink)}
</style></head><body>
<h1>REDLINE<em>.</em><br>CAMPAIGN</h1>
<div id="tag">25 PARTS · ONE LINE · CHOOSE HOW IT ENDS</div>
<div id="bar"><i></i></div><div id="pct">0% COMPLETE</div>
<div id="list"></div>
<a id="back" href="../index.html">← BACK TO REDLINE</a>
<script>
const ACTS=[
 ['ACT I — BLACKOUT',[
  ['LAST TRAIN','Depot night shift. The Event hits. Escape to the surface.'],
  ['DEAD SIGNAL','Climb to West Control. Meet Dutch face to face.'],
  ['THE DENIZENS','Cross the fog to Town. Survivors hold the bar.'],
  ['QUARANTINE','Helix seals the surface. Fight both sides.'],
  ['LAST BROADCAST','Hijack the tower. Boss: the First Brute.']]],
 ['ACT II — THE DRIFT',[
  ['RIDE THE LINE','Bus loop under siege. Hold every stop.'],
  ['SCARECROW','Fortify the Farm through a siege night.'],
  ['GRID','Throw the power lever. The lights come on.'],
  ['HATCH','A sealed Helix door under the transformers.'],
  ['UNDERSTORY','Descend into the lab. No music. Heartbeat only.']]],
 ['ACT III — HELIX',[
  ['SUBJECT ZERO','Lab logs. Mara\u2019s name.'],
  ['PALE HORSE','The Stationmaster purges evidence — and witnesses.'],
  ['THE TRAITOR','Someone sold the Denizens for a seat in Station Zero.'],
  ['SIREN','Every walker becomes a runner for three minutes.'],
  ['THE CONDUCTOR','Boss on a moving train. Cut the rail.']]],
 ['ACT IV — THE LONG ROAD',[
  ['CONVOY','Highway run out of the city.'],
  ['STATIC','A horde that mimics voices.'],
  ['THE DAM','Drown the horde in the spillway.'],
  ['STATION ZERO','The \u201csafe zone\u201d is the final test site.'],
  ['PROOF','Steal the archive. Find Mara, half-taken.']]],
 ['ACT V — REDLINE',[
  ['HOMEWARD','Fight back up the Red Line, now rotted.'],
  ['THE LOOP','The buried original tunnel. 1968 under 2024.'],
  ['CONFESSION','The Conductor\u2019s story. The choice takes shape.'],
  ['LAST STOP','Runaway train through the horde.'],
  ['TERMINUS','Cut the line\u2026 take the line\u2026 or derail yourself.']]],
];
const BUILT={1:'done',2:'ready'};
const done=new Set(JSON.parse(localStorage.getItem('redline_campaign_done')||'[]'));
let n=0,rows='';
for(const[act,ms]of ACTS){
 rows+=`<h2>${act}</h2>`;
 for(const[t,d]of ms){n++;
  const st=done.has(n)?'done':(BUILT[n]||'lock');
  const inner=`<span class="n">${String(n).padStart(2,'0')}</span>
   <span><div class="t">${t}</div><div class="d">${d}</div></span>
   <span class="s ${st}">${st==='done'?'CLEARED':st==='ready'?'PLAY':'LOCKED'}</span>`;
  rows+=st==='lock'?`<div class="m">${inner}</div>`
   :`<a class="m ready" href="part-${String(n).padStart(2,'0')}.html">${inner}</a>`;}
}
document.getElementById('list').innerHTML=rows;
const pct=Math.round(done.size/25*100);
document.querySelector('#bar i').style.width=pct+'%';
document.getElementById('pct').textContent=pct+'% COMPLETE';
</script></body></html>
