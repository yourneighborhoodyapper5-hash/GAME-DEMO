<script type="module">
import * as THREE from 'three';
/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const MOB=('ontouchstart'in window)&&matchMedia('(pointer:coarse)').matches
 &&matchMedia('(hover:none)').matches;
if(MOB)document.body.classList.add('mob');
/* ================= audio ================= */
let AC=null,master=null,noiseB=null;
function initAudio(){
 if(AC)return;
 AC=new (window.AudioContext||window.webkitAudioContext)();
 master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
 noiseB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
 const d=noiseB.getChannelData(0);
 for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function tone(f,dur,type,vol,slide){
 if(!AC)return;const t=AC.currentTime;
 const o=AC.createOscillator(),g=AC.createGain();
 o.type=type||'square';o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+dur);
 g.gain.setValueAtTime(vol||.15,t);
 g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
function nHit(dur,vol,f0,f1){
 if(!AC)return;const t=AC.currentTime;
 const s=AC.createBufferSource();s.buffer=noiseB;
 const f=AC.createBiquadFilter();f.type='lowpass';
 f.frequency.setValueAtTime(f0,t);
 f.frequency.exponentialRampToValueAtTime(Math.max(60,f1),t+dur);
 const g=AC.createGain();
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.02);
}
const SFX={
 shot(){nHit(.13,.5,3600,300);tone(150,.1,'triangle',.24,-90);},
 dry(){tone(900,.04,'square',.08);},
 reload(){tone(480,.06,'square',.12);setTimeout(()=>tone(720,.06,'square',.12),130);},
 reloadEnd(){tone(920,.07,'square',.13);},
 hurt(){tone(130,.2,'sawtooth',.2,-55);nHit(.15,.2,800,140);},
 kill(){tone(180,.15,'triangle',.26,-80);},
 growl(){tone(66,.8,'sawtooth',.2,-22);},
 scream(){tone(300,1,'sawtooth',.28,520);nHit(.8,.16,2400,500);},
 pound(){nHit(.12,.34,500,90);tone(70,.12,'sine',.3,-20);},
 powerDown(){tone(220,1.2,'sawtooth',.22,-180);nHit(1,.2,1400,90);},
 spark(){nHit(.1,.24,5200,900);},
 clank(){nHit(.09,.24,3000,500);tone(210,.08,'square',.14);},
 sting(){[196,262,330,392].forEach((f,i)=>setTimeout(()=>tone(f,.35,'triangle',.15),i*130));},
 heartbeat(){tone(52,.13,'sine',.4,-18);setTimeout(()=>tone(46,.11,'sine',.28,-14),170);},
};
/* ambience: wind + hum, state-driven */
let ambOn=false,ambNodes=[],humOsc=null,humG=null;
function ambStart(){
 if(!AC||ambOn)return;ambOn=true;
 const w=AC.createBufferSource();w.buffer=noiseB;w.loop=true;
 const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=.5;
 const g=AC.createGain();g.gain.value=.028;
 const lfo=AC.createOscillator();lfo.frequency.value=.08;
 const lg=AC.createGain();lg.gain.value=200;
 lfo.connect(lg);lg.connect(bp.frequency);
 w.connect(bp);bp.connect(g);g.connect(master);
 w.start();lfo.start();ambNodes.push(w,lfo,g);
 humOsc=AC.createOscillator();humOsc.type='sawtooth';humOsc.frequency.value=58;
 const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=160;
 humG=AC.createGain();humG.gain.value=.016;
 humOsc.connect(lp);lp.connect(humG);humG.connect(master);humOsc.start();
}
function ambStop(){if(!ambOn)return;ambOn=false;
 ambNodes.forEach(n=>{try{n.stop&&n.stop();}catch(e){}try{n.disconnect();}catch(e){}});
 ambNodes=[];try{humOsc.stop();}catch(e){}humOsc=null;}
function heartStart(){if(heartIv)return;heartIv=setInterval(()=>SFX.heartbeat(),950);}
function heartStop(){clearInterval(heartIv);heartIv=null;}
let heartIv=null;
/* pulse loop for the hold */
let pulseIv=null;
function pulseStart(){if(pulseIv)return;
 pulseIv=setInterval(()=>{tone(46,.14,'sine',.34,-14);if(Math.random()<.5)
 setTimeout(()=>tone(44,.1,'sine',.2,-10),260);},520);}
function pulseStop(){clearInterval(pulseIv);pulseIv=null;}
/* ================= renderer / scene ================= */
const renderer=new THREE.WebGLRenderer({antialias:!MOB,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,MOB?1.5:2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=!MOB;
renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);});
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1a1712);
scene.fog=new THREE.Fog(0x1a1712,10,70);
const camera=new THREE.PerspectiveCamera(76,innerWidth/innerHeight,.05,300);
camera.rotation.order='YXZ';scene.add(camera);
const hemi=new THREE.HemisphereLight(0xcfb98a,0x4a4034,.85);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffd9a6,1.4);
sun.position.set(14,18,8);sun.castShadow=!MOB;
sun.shadow.mapSize.set(1024,1024);sun.shadow.bias=-.0005;
sun.shadow.camera.left=-40;sun.shadow.camera.right=40;
sun.shadow.camera.top=40;sun.shadow.camera.bottom=-60;
scene.add(sun);scene.add(sun.target);
const lampLight=new THREE.PointLight(0xffd9a0,.7,26,1.6);
lampLight.position.set(0,3.4,10);scene.add(lampLight);
const flash=new THREE.SpotLight(0xfff0d0,0,30,.5,.45,1.3);
camera.add(flash);camera.add(flash.target);
flash.position.set(0,-.1,0);flash.target.position.set(0,0,-6);
const muzzleL=new THREE.PointLight(0xffdcae,0,10,2);scene.add(muzzleL);
/* lighting states */
const LIGHTS={
 NORMAL:{bg:0x1a1712,fog:[10,70],hemi:.85,sun:1.4,flash:0,red:0},
 RED:{bg:0x140808,fog:[7,44],hemi:.3,sun:.25,flash:0,red:1},
 DARK:{bg:0x05070a,fog:[2,20],hemi:.12,sun:0,flash:3.2,red:0},
 REVEAL:{bg:0x2a120a,fog:[16,240],hemi:.55,sun:.5,flash:0,red:0},
};
const redLamps=[];
function setLight(name){
 const L=LIGHTS[name];
 scene.background.set(L.bg);scene.fog.color.set(L.bg);
 scene.fog.near=L.fog[0];scene.fog.far=L.fog[1];
 hemi.intensity=L.hemi;sun.intensity=L.sun;
 lampLight.intensity=name==='NORMAL'?.7:0;
 flash.intensity=L.flash;
 redLamps.forEach(l=>l.intensity=L.red?2.6:0);
 lightState=name;
}
let lightState='NORMAL';
/* ================= materials / world ================= */
const M={
 con:new THREE.MeshStandardMaterial({color:0x8f887a,roughness:.9}),
 conD:new THREE.MeshStandardMaterial({color:0x57524a,roughness:.95}),
 metal:new THREE.MeshStandardMaterial({color:0x63666e,roughness:.45,metalness:.7}),
 wood:new THREE.MeshStandardMaterial({color:0x6a5638,roughness:1}),
 red:new THREE.MeshStandardMaterial({color:0x8e2018,roughness:.6,emissive:0x400a06}),
 dark:new THREE.MeshStandardMaterial({color:0x24211d,roughness:1}),
 door:new THREE.MeshStandardMaterial({color:0x4a5158,roughness:.5,metalness:.6}),
 skin:new THREE.MeshStandardMaterial({color:0x93a184,roughness:.92,flatShading:true}),
 shirt:new THREE.MeshStandardMaterial({color:0x413a30,roughness:.95,flatShading:true}),
 pant:new THREE.MeshStandardMaterial({color:0x2c2a26,roughness:.95,flatShading:true}),
 eye:new THREE.MeshBasicMaterial({color:0xffb545}),
};
const colliders=[];
function box(w,h,d,x,y,z,m,solid=true){
 const q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
 q.position.set(x,y,z);q.castShadow=!MOB;q.receiveShadow=true;scene.add(q);
 if(solid)colliders.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2});
 return q;
}
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;
 const x=c.getContext('2d');const g=x.createRadialGradient(32,32,2,32,32,30);
 g.addColorStop(0,'rgba(255,220,150,1)');g.addColorStop(1,'rgba(255,150,60,0)');
 x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);})();
function buildWorld(){
 const fl=new THREE.Mesh(new THREE.PlaneGeometry(140,120),M.con);
 fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;scene.add(fl);
 /* break room (A): x -6..6, z 8..16 */
 box(12,3.4,.4,0,1.7,16.2,M.conD);box(12,3.4,.4,0,1.7,7.8,M.conD).visible=false;
 box(.4,3.4,8.4,-6.2,1.7,12,M.conD);box(.4,3.4,8.4,6.2,1.7,12,M.conD);
 box(2.4,1,1.2,3,0.5,13,M.wood);          // table (mug lives here)
 box(.5,2,2.2,-5.4,1,14.6,M.metal);       // lockers row
 box(.5,2,2.2,-5.4,1,10.6,M.metal);
 /* corridor: z 2..8, width 3 at x -1.5..1.5 */
 box(9,3.4,.4,-5.6,1.7,7.8,M.conD);
 box(9,3.4,.4,5.6,1.7,7.8,M.conD);
 /* garage: x -14..14, z -26..2 */
 box(28.8,4,.5,0,2,2.2,M.conD);           // north wall w/ corridor gap
 box(28.8,4,.5,0,2,2.2-0.001,M.conD).visible=false;
 box(.5,4,28.5,-14.2,2,-12,M.conD);       // west
 box(.5,4,28.5,14.2,2,-12,M.conD);        // east
 box(28.8,4,.5,0,2,-26.2,M.conD);         // south behind doors
 /* corridor gap in north wall x -1.5..1.5 handled by two segments */
 scene.children[scene.children.length-1].visible=false;
 colliders.pop();
 box(12.4,4,.5,-8.2,2,2.2,M.conD);
 box(12.4,4,.5,8.2,2,2.2,M.conD);
 /* bay doors (south, two slabs with center pillar) */
 box(8,3.6,.3,-5,1.8,-25.9,M.door);box(8,3.6,.3,5,1.8,-25.9,M.door);
 box(2,4,.5,0,2,-26,M.red);
 /* props: generator, shelves, barrels, train buffer */
 const gen=box(2.2,1.6,1.4,10,.8,-22,M.metal);
 genP.body=gen;
 box(6,2,.6,-11,1,-4,M.metal);
 for(const[bx,bz]of[[-8,8],[12,-14],[-12,-18],[6,-20]])
  box(.7,1.1,.7,bx,.55,bz,M.dark);
 box(1.6,1,2.4,-13,.5,-12,M.metal);       // buffer stop
 /* service tunnel: x 14..50, z -8..-4 */
 box(.4,3.2,4.6,14.2,1.6,-10+2,M.conD);
 box(.4,3.2,4.6,50,1.6,-6,M.conD);
 box(36.5,3.2,.4,32,1.6,-3.8,M.dark);
 box(36.5,3.2,.4,32,1.6,-8.2,M.dark);
 /* east wall gap for tunnel entrance */
 scene.children[scene.children.length-2].visible=false;colliders.pop();
 box(.5,4,10,14.2,2,-21,M.conD);box(.5,4,10,14.2,2,-1,M.conD);
 /* overlook / surface (x 50..58) */
 const ramp=box(8,.4,4.4,54,.2,-6,M.conD,false);ramp.rotation.z=.06;
 for(let i=0;i<14;i++){ // skyline silhouettes
  const w=rnd(6,16),h=rnd(10,34);
  const b=box(w,h,w*rnd(.6,1.2),rnd(38,70),h/2,-rnd(120,170),M.dark,false);
  skyGroup.add(b);
 }
 for(let i=0;i<8;i++){ // fires
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xff8a30,
   transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  s.position.set(rnd(34,72),rnd(2,14),-rnd(110,160));
  s.scale.setScalar(rnd(8,22));
  skyGroup.add(s);skyFires.push(s);
 }
 skyGroup.visible=false;scene.add(skyGroup);
}
const skyGroup=new THREE.Group();const skyFires=[];
let genP={body:null,on:false,t:0};
/* red emergency lamps */
for(const[x,z]of[[0,12],[0,-2],[-5,-14],[5,-14],[0,-24]]){
 const l=new THREE.PointLight(0xff2418,0,16,1.7);
 l.position.set(x,3,z);scene.add(l);redLamps.push(l);
 const b=new THREE.Mesh(new THREE.SphereGeometry(.08,6,6),
  new THREE.MeshBasicMaterial({color:0x330b08}));
 b.position.copy(l.position);scene.add(b);
}
/* ================= collision / player ================= */
function resolveCircle(px,pz,r){
 for(const c of colliders){
  if(px>c.x0-r&&px<c.x1+r&&pz>c.z0-r&&pz<c.z1+r){
   const d1=px-(c.x0-r),d2=(c.x1+r)-px,d3=pz-(c.z0-r),d4=(c.z1+r)-pz;
   const m=Math.min(d1,d2,d3,d4);
   if(m===d1)px=c.x0-r;else if(m===d2)px=c.x1+r;
   else if(m===d3)pz=c.z0-r;else pz=c.z1+r;
  }
 }
 return[clamp(px,-40,60),clamp(pz,-28,18)];
}

 const la=mkArm(-1),ra=mkArm(1);

  const up=new THREE.Mesh(new THREE.CapsuleGeometry(.075,.4,4,8),M.pant);

function updateZombies(dt){
 const now=perfT;
 for(let i=zombies.length-1;i>=0;i--){
  const z=zombies[i],ud=z.m.userData;
  if(z.dead){
   z.deadT+=dt;
   const k=Math.min(1,z.deadT/.5);
   z.m.rotation.x=z.fallDir*k*1.5;z.m.rotation.z=z.fallSide*.6*k;
   if(z.deadT>=1.2)z.m.position.y=-(z.deadT-1.2)*.7;
   if(z.deadT>2.4){scene.remove(z.m);zombies.splice(i,1);}
   continue;
  }
  z.flinch=Math.max(0,z.flinch-dt*3);
  const dx=player.pos.x-z.pos.x,dz=player.pos.z-z.pos.z;
  const dist=Math.hypot(dx,dz)||.001;
  z.m.rotation.y=Math.atan2(-dx,-dz);
  if(z.swingT>0){ // lunge
   z.swingT-=dt;
   const sk=Math.max(0,z.swingT)/.3;
   ud.la.rotation.x=-.4-sk*1.6;ud.ra.rotation.x=-.3-sk*1.7;
   ud.jaw.rotation.x=.35+sk*.45;
  }else if(z.pin&&dist>4.5){ // pounding the bay door
   z.walkT+=dt*9;
   const p=Math.abs(Math.sin(z.walkT*1.4));
   ud.la.rotation.x=-1.4-p*.9;ud.ra.rotation.x=-1.3-p*.9;
   if(p>.92){if(Math.random()<.4)SFX.pound();
    burstSmall(z.pin.x,1.6,z.pin.z,0xffd27a);}
  }else{
   const move=z.pin?null:{x:dx/dist,z:dz/dist};
   let nx=z.pos.x,nz=z.pos.z;
   if(move){
    nx+=move.x*z.speed*dt;nz+=move.z*z.speed*dt;
    [nx,nz]=resolveCircle(nx,nz,.35);
    z.pos.x=nx;z.pos.z=nz;
   }
   z.walkT+=dt*(z.runner?11:5.5);
   const sw=Math.sin(z.walkT);
   ud.ll.rotation.x=sw*.55;ud.rl.rotation.x=-sw*.55;
   const reach=clamp(1-(dist-1.6)/3,0,1);
   const pump=z.runner?Math.sin(z.walkT)*.7:Math.sin(z.walkT*.5)*.14;
   ud.la.rotation.x=-1.15-reach*.5+pump;
   ud.ra.rotation.x=-1.02-reach*.5-pump;
   ud.jaw.rotation.x=.1+Math.max(0,Math.sin(now*6+z.walkT))*.07;
   ud.head.rotation.z=Math.sin(now*1.2+z.walkT)*.15;
   if(!z.pin&&dist<1.5&&z.atkCd<=0){
    z.atkCd=1;z.swingT=.3;
    setTimeout(()=>{if(!z.dead&&Math.hypot(player.pos.x-z.pos.x,
     player.pos.z-z.pos.z)<2)hurtPlayer(12);},300);
   }
  }
  z.atkCd=Math.max(0,z.atkCd-dt);
  if(z.flinch>0){ud.head.rotation.x=z.flinch*2;}
  z.m.position.set(z.pos.x,Math.abs(Math.sin(z.walkT))*.04,z.pos.z);
 }
}

const _d=new THREE.Vector3();
function raySphere(o,d,cx,cy,cz,r){
 const lx=cx-o.x,ly=cy-o.y,lz=cz-o.z;
 const b=lx*d.x+ly*d.y+lz*d.z;
 if(b<0)return Infinity;
 const q=lx*lx+ly*ly+lz*lz-b*b;
 if(q>r*r)return Infinity;
 const t=b-Math.sqrt(r*r-q);return t>.01?t:Infinity;
}

const CINE={active:false,steps:[],si:0,end:null};
function cineStart(steps,onEnd){
 CINE.active=true;CINE.steps=steps;CINE.si=0;CINE.end=onEnd||null;
 document.body.classList.add('cine');
 player.freeze=true;mouseHeld=false;

function cineEnd(){
 if(!CINE.active)return;
 CINE.active=false;
 document.body.classList.remove('cine');
 $('cineTitle').classList.remove('on');
 $('hud').style.opacity='';
 const f=CINE.end;CINE.end=null;
 if(f)f();
}
addEventListener('keydown',e=>{if(CINE.active){e.stopPropagation();cineEnd();}},true);
addEventListener('pointerdown',e=>{if(CINE.active){e.stopPropagation();cineEnd();}},true);
function cineUpdate(rdt){
 const st=CINE.steps[CINE.si];
 if(!st){cineEnd();return;}
 if(st._t===undefined){st._t=0;st._on=false;}
 st._t+=rdt;
 const k=st.dur?Math.min(1,st._t/st.dur):1;
 if(st.type==='cam'){
  const ek=1-Math.pow(1-k,2);
  camera.position.lerpVectors(st.from,st.to,ek);
  if(st.look)camera.lookAt(st.look);
 }else if(st.type==='title'){
  if(!st._on){st._on=true;
   const ti=$('cineTitle');
   ti.innerHTML=st.main+(st.sub?`<small>${st.sub}</small>`:'');
   ti.classList.add('on');}
 }else if(st.type==='line'){
  if(!st._on){st._on=true;
   subEl.style.display='block';
   $('subWho').textContent=st.who;$('subTx').textContent='';
   st.chars=0;if(st.sfx)st.sfx();}
  const w=Math.min(st.text.length,Math.floor(st._t*34));
  if(w!==st.chars){st.chars=w;$('subTx').textContent=st.text.slice(0,w);}
 }else if(st.type==='fn'&&st.fn)st.fn();
 if(k>=1){
  if(st.type==='title')$('cineTitle').classList.remove('on');
  if(st.type==='line')subEl.style.display='none';
  st._t=undefined;st._on=false;CINE.si++;
 }
}

 inters.push({x:-4.6,z:3.4,done:false,fn(){

  hasGun=true;mag=12;updAmmo();
  inters.find(i=>i.x===-4.6).done=true;
  SFX.clank();setTimeout(()=>SFX.reloadEnd(),200);
  vm.visible=true;
  say('NIGHTSHIFT','Old M1911 from my locker. Twelve rounds. It will have to do.',3.4);
  say('DUTCH','Kid… whatever is making that noise, you do NOT open the bay doors.',3.6);
  mission='contact';
  setObjective('REACH THE GARAGE FLOOR');
 }});
 bufferMesh=null;
 inters.push({x:-13,z:-12,done:false,fn(){
  if(mission!=='rail')return;
  inters.find(i=>i.x===-13).done=true;
  say('NIGHTSHIFT','Third rail is dead. No power on the mainline. No train.',3.4);
  say('DUTCH','Then you take the service tunnel — old Line, east wall. Watch yourself down there.',4);
  mission='tunnel';
  setObjective('SERVICE TUNNEL · EAST WALL');
 }});
 vm.visible=false;
}
/* ================= main loop ================= */
let perfT=0,contactDone=false;
function frame(){
 requestAnimationFrame(frame);
 const rdt=Math.min(clock.getDelta(),.05);
 perfT+=rdt;
 if(CINE.active){
  cineUpdate(rdt);
 }else if(!player.freeze){
  /* look */
  player.yaw-=touch.ldx*.003;player.pitch=clamp(player.pitch-touch.ldy*.003,-1.4,1.4);
  touch.ldx=0;touch.ldy=0;
  /* move */
  let f=(keys.KeyW?1:0)-(keys.KeyS?1:0)+touch.my;
  let s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+touch.mx;
  const l=Math.hypot(f,s);if(l>1){f/=l;s/=l;}
  const run=keys.ShiftLeft||touch.run;
  const spd=run?6.6:4.1;
  const sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);
  const wx=s*cy-f*sy,wz=-f*cy-s*sy;
  player.vel.x+=(wx*spd-player.vel.x)*Math.min(1,12*rdt);
  player.vel.z+=(wz*spd-player.vel.z)*Math.min(1,12*rdt);
  player.pos.x+=player.vel.x*rdt;player.pos.z+=player.vel.z*rdt;
  const r=resolveCircle(player.pos.x,player.pos.z,.38);
  player.pos.x=r[0];player.pos.z=r[1];
  player.bobT+=rdt*Math.hypot(player.vel.x,player.vel.z)*1.5;
  /* regen */
  if(player.regenT>0)player.regenT-=rdt;
  else if(player.hp<player.maxHp){player.hp=Math.min(player.maxHp,player.hp+8*rdt);updHp();}
  /* fire */
  if(reloadT>0){
   reloadT-=rdt;
   if(reloadT<=0){
    const need=12-mag,take=Math.min(need,reserve);
    mag+=take;reserve-=take;SFX.reloadEnd();updAmmo();}
  }
  if(mouseHeld||touch.fire)shoot();
  /* mug scripted beat */
  if(mugT>0){
   mugT-=rdt;
   if(mugT<=0&&mug){
    mug.rotation.z=1.5;mug.position.y-=.9;
    setTimeout(()=>{scene.remove(mug);SFX.clank();
     say('','(something moved in the dark)',2.6);},600);
   }
  }
  /* camera */
  shakeT=Math.max(0,shakeT-3*rdt);
  const sh=shakeT;
  camera.position.set(
   player.pos.x+rnd(-sh,sh)*.08,
   1.62+Math.sin(player.bobT)*.03+rnd(-sh,sh)*.08,
   player.pos.z+rnd(-sh,sh)*.08);
  camera.rotation.set(player.pitch,player.yaw,-Math.sin(player.bobT)*.006);
  /* vignette decay */
  const v=$('vig');const cv=parseFloat(v.style.opacity||0);
  if(cv>0)v.style.opacity=Math.max(0,cv-rdt*1.2);
  /* flashlight follows state */
  /* mission */
  missionUpdate(rdt);
  checkTriggers();
  updateZombies(rdt);
  updWatchers(rdt);
  /* sparks */
  for(let i=sparks.length-1;i>=0;i--){
   sparks[i].t-=rdt;
   if(sparks[i].t<=0){scene.remove(sparks[i].s);sparks.splice(i,1);}
  }
  if(flashT>0){flashT-=rdt;if(flashT<=0)flashSpr.visible=false;}
  muzzleL.intensity=Math.max(0,muzzleL.intensity-rdt*30);
  updSub(rdt);
  /* interact prompt */
  let near=null;
  for(const it of inters)if(!it.done&&Math.hypot(player.pos.x-it.x,player.pos.z-it.z)<2.4)near=it;
  const pr=$('prompt');
  if(near){
   $('pTxt').textContent=near===inters[0]?'TAKE M1911':'CHECK THE TRAIN';
   $('pKey').textContent=MOB?'USE':'F';
   pr.style.display='block';
  }else pr.style.display='none';
  if(AC&&ambOn&&humG&&lightState==='DARK')humG.gain.value=.004;
 }
 /* fires flicker at reveal */
 if(skyGroup.visible)for(const s of skyFires)
  s.scale.setScalar(s.scale.x*(1+(Math.random()-.5)*.06));
 renderer.render(scene,camera);
}
const clock=new THREE.Clock();
/* ---------- mission state machine ---------- */
function missionUpdate(dt){
 if(mission==='wake'&&player.pos.z<8.5){
  mission='blackout';
  SFX.powerDown();SFX.spark();
  setLight('RED');
  burstSmall(0,3.4,10,0xffe6a0);burstSmall(-4,3.4,12,0xffe6a0);
  say('DUTCH','Nightshift?! My board just went black — the WHOLE line just went black!',3.8);
  say('NIGHTSHIFT','Everything is on emergency red. Something is very wrong.',3.2);
  setObjective('GET TO THE LOCKER ROOM · ARM YOURSELF');
  mission='gun';
 }
 if(mission==='contact'&&!contactDone&&player.pos.z<-4){
  contactDone=true;
  contactZ={};
  spawnZombie(0,-24,{});
  const z=zombies[zombies.length-1];
  z.state='contact';
  say('','(far across the garage floor — a shape in the red)',3);
  contactPhase=1;
 }
 if(mission==='tunnel'&&player.pos.x>15.5){
  setLight('DARK');
  ambStop();heartStart();
  buildWatchers();
  say('NIGHTSHIFT','Flashlight on. Old Line. Okay. Okay.',3);
  say('DUTCH','(radio breaks up) …-tshift… say again… -ou copy…',3.4);
  setObjective('FOLLOW THE TUNNEL TO THE SURFACE');
  mission='tunnelWalk';
 }
 if(mission==='tunnelWalk'&&player.pos.x>48){
  mission='reveal';
  endingCine();
 }
 if(mission==='hold')updHold(dt);
}
let contactPhase=0,contactT=0;
/* contact zombie script: walks to 12m, screams, retreats into fog */
const _origUpdZ=updateZombies;
updateZombies=function(dt){
 if(contactPhase>0&&contactPhase<3){
  const z=zombies.find(z=>z.state==='contact'&&!z.dead);
  if(z){
   contactT+=dt;
   const dx=player.pos.x-z.pos.x,dz=player.pos.z-z.pos.z;
   const dist=Math.hypot(dx,dz)||.001;
   z.m.rotation.y=Math.atan2(-dx,-dz);
   if(contactPhase===1){
    if(dist>12){
     z.pos.x+=dx/dist*1.2*dt;z.pos.z+=dz/dist*1.2*dt;
     z.walkT+=dt*4;
     const ud=z.m.userData,sw=Math.sin(z.walkT);
     ud.ll.rotation.x=sw*.4;ud.rl.rotation.x=-sw*.4;
    }else{
     contactPhase=2;contactT=0;SFX.scream();
     say('DUTCH','(radio) WHAT WAS THAT?! Nightshift, REPORT!',3);
    }
   }else if(contactPhase===2){
    z.m.position.set(z.pos.x,0,z.pos.z);
    if(contactT>1.6){
     contactPhase=3;SFX.growl();
     for(let i=0;i<5;i++)tone&&0;
     say('NIGHTSHIFT','…Dutch. The whole floor is answering it.',3.2);
     setTimeout(()=>{
      SFX.scream();
      say('DUTCH','SEAL THE GARAGE — generator, NOW! Go go go!',3.4);
      startHold();
     },1800);
     /* walker retreats */
     const back=setInterval(()=>{
      z.pos.z-=6*.05;z.m.position.z=z.pos.z;
      if(z.pos.z<-23.5){clearInterval(back);z.dead=true;z.deadT=1.3;
       z.m.visible=false;}
     },50);
    }
   }
  }
 }
 _origUpdZ(dt);
};
/* ---------- ending ---------- */
function endingCine(){
 heartStop();
 setLight('REVEAL');
 skyGroup.visible=true;
 const p=player.pos.clone();
 const from=new THREE.Vector3(48,1.8,-6);
 const to=new THREE.Vector3(53,4,-10);
 const look=new THREE.Vector3(52,8,-140);
 camera.position.copy(from);camera.lookAt(look);
 cineStart([
  {type:'title',main:'MERIDIAN',sub:'NIGHT 0',dur:3},
  {type:'cam',from,to,look,dur:6},
  {type:'line',who:'DUTCH',dur:4.2,sfx:()=>SFX.sting(),
   text:'(static clears) …Nightshift?! The whole city grid is down. Every light. What is happening out there?'},
  {type:'line',who:'NIGHTSHIFT',dur:3.6,
   text:'The dead are walking, Dutch. All of Meridian. And they are singing.'},
  {type:'title',main:'LAST TRAIN',sub:'PART 01 COMPLETE',dur:3.4},
 ],showEnd);
}
function showEnd(){
 player.freeze=true;
 document.exitPointerLock&&document.exitPointerLock();
 const done=new Set(JSON.parse(localStorage.getItem('redline_campaign_done')||'[]'));
 done.add(1);
 try{localStorage.setItem('redline_campaign_done',JSON.stringify([...done]));}catch(e){}
 const mins=((performance.now()-stats.t0)/60000).toFixed(1);
 const acc=stats.shots?Math.round(stats.hits/stats.shots*100):100;
 $('endSt').innerHTML=
  `TIME — ${mins} MIN<br>KILLS — ${stats.kills} · ACCURACY — ${acc}%<br>PART 02 — DEAD SIGNAL · UNLOCKED`;
 $('hud').classList.remove('on');
 $('end').style.display='flex';
}
/* ---------- bootstrapping fix ---------- */
/* build world lazily on boot so mug/locker refs exist before cine */
const _startGame=startGame;
startGame=function(){
 _startGame();
 setupInteract();
 openingCine();
};
frame();
</script>
